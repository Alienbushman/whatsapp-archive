[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-archive"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "selectolax>=0.3",
    "qdrant-client>=1.9",
    "rapidfuzz>=3.10",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    "yfinance>=0.2.40",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
wa-archive = "whatsapp_archive.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
